<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIY参数化 · 非标自动化参数化设计</title>
<meta name="description" content="只要变化有规律，就可实现自动设计。不写代码、不做二次开发，自己总结变化规律，自主定义参数化设计，培训3天包教包会。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230B2A4A'/%3E%3Ccircle cx='20' cy='20' r='13' stroke='%23F59E0B' stroke-width='3' fill='none'/%3E%3Ccircle cx='20' cy='20' r='5.5' fill='%2335C2E8'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.2/dist/docx-preview.min.js"></script>
<style>
  :root{
    --navy:#0B2A4A;
    --navy-2:#123A63;
    --blue:#1E6FD9;
    --blue-light:#4D94EA;
    --cyan:#35C2E8;
    --orange:#F59E0B;
    --ink:#1B2A3A;
    --gray:#5A6B7B;
    --line:#E3EAF2;
    --bg:#F5F8FC;
    --white:#fff;
    --radius:14px;
    --shadow:0 10px 30px rgba(11,42,74,.10);
    --font:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
    --mono:"Consolas","Courier New",monospace;
    /* 主题变量（默认：宣纸） */
    --paper:#FBF7EF;
    --paper-rgb:251,247,239;
    --paper-2:#F7F1E4;
    --paper-3:#F3ECDC;
    --ink:#2B2622;
    --ink-2:#4A433A;
    --ink-3:#6F675C;
    --ink-4:#5A6E82;
    --ink-rgb:43,38,34;
    --gold:#A97B2F;
    --gold-rgb:169,123,47;
    --bg-page:#F7F1E4;
  }
  /* 主题：素 */
  html[data-theme="su"]{
    --paper:#FFFFFF;
    --paper-rgb:255,255,255;
    --paper-2:#F8F8F6;
    --paper-3:#F0F0EC;
    --ink:#26221E;
    --ink-2:#3F3A33;
    --ink-3:#66605A;
    --ink-4:#5A6672;
    --ink-rgb:38,34,30;
    --gold:#B3541E;
    --gold-rgb:179,84,30;
    --bg-page:#F7F7F5;
  }
  /* 主题：墨夜 */
  html[data-theme="moye"]{
    --paper:#14181D;
    --paper-rgb:20,24,29;
    --paper-2:#1A2027;
    --paper-3:#202730;
    --ink:#E9E5DC;
    --ink-2:#C9C3B8;
    --ink-3:#9A948A;
    --ink-4:#8AA0B4;
    --ink-rgb:233,229,220;
    --gold:#D9A654;
    --gold-rgb:217,166,84;
    --bg-page:#101418;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);color:var(--ink);background:var(--bg-page);line-height:1.7;transition:background .4s ease,color .4s ease}
  a{text-decoration:none;color:inherit}
  img{max-width:100%}

  /* ===== 导航 ===== */
  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    background:rgba(var(--paper-rgb),.94);backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(var(--ink-rgb),.10);
  }
  .nav-wrap{max-width:1180px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--ink);letter-spacing:1px}
  .logo svg{flex-shrink:0;transition:transform .8s cubic-bezier(.34,1.4,.64,1)}
  .logo:hover svg{transform:rotate(360deg)}
  .logo b{color:var(--gold)}
  nav{display:flex;gap:22px}
  nav a{color:var(--ink-2);font-size:15px;transition:color .2s;letter-spacing:1px;position:relative}
  nav a:hover{color:var(--gold)}
  nav a.cur{color:var(--gold);font-weight:700;position:relative}
  nav a.cur::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--gold);border-radius:2px}
  .nav-center{display:flex;align-items:center;gap:20px}
  .nav-search{display:flex;align-items:center;gap:8px;border:1px solid rgba(var(--ink-rgb),.2);background:var(--paper-2);border-radius:999px;padding:6px 14px;width:190px;transition:border-color .2s,box-shadow .2s}
  .nav-search:focus-within{border-color:var(--gold);box-shadow:0 0 0 2px rgba(var(--gold-rgb),.15)}
  .nav-search svg{flex-shrink:0}
  .nav-search input{border:none;background:none;outline:none;font-size:13px;color:var(--ink);width:100%;font-family:var(--font)}
  .nav-search input::placeholder{color:var(--ink-3)}
  .nav-search .search-kbd{font-family:var(--mono);font-size:11px;color:var(--ink-3);border:1px solid rgba(var(--ink-rgb),.22);border-radius:4px;padding:1px 6px;flex-shrink:0}
  .theme-switch{display:flex;gap:4px;align-items:center;border:1px solid rgba(var(--ink-rgb),.22);border-radius:999px;padding:3px;margin-left:14px}
  .theme-switch button{border:none;background:none;color:var(--ink-2);font-size:12px;padding:4px 12px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s;letter-spacing:2px}
  .theme-switch button.on{background:var(--gold);color:#fff}
  .menu-btn{display:none;background:none;border:1px solid rgba(var(--ink-rgb),.35);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
  .nav-right{display:flex;align-items:center;gap:10px}
  .logo svg circle,.logo svg path{transition:stroke .3s}
  .logo svg circle:first-of-type{stroke:var(--gold)}
  .logo svg circle:last-of-type{fill:var(--ink-4)}
  .logo svg path{stroke:var(--gold)}

  /* ===== Hero 轮播 ===== */
  .hero{
    position:relative;color:var(--ink);padding:0;
    background:
      radial-gradient(1000px 500px at 82% -10%,rgba(var(--gold-rgb),.10),transparent 60%),
      radial-gradient(800px 400px at 10% 110%,rgba(var(--ink-rgb),.06),transparent 60%),
      linear-gradient(160deg,var(--paper) 0%,var(--paper-2) 55%,var(--paper-3) 100%);
    overflow:hidden;
  }
  .hero::before{ /* 图纸网格 */
    content:"";position:absolute;inset:0;opacity:.55;pointer-events:none;
    background-image:
      linear-gradient(rgba(var(--ink-rgb),.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(var(--ink-rgb),.06) 1px,transparent 1px);
    background-size:52px 52px;
    mask-image:radial-gradient(ellipse at 50% 42%,#000 25%,transparent 78%);
  }
  .slides{position:relative;height:560px;max-width:1180px;margin:0 auto}
  .slide{position:absolute;inset:0;padding:0 40px;display:flex;align-items:center;justify-content:space-between;gap:40px;opacity:0;visibility:hidden;transform:translateX(40px);transition:opacity .7s ease,transform .7s ease,visibility .7s}
  .slide.on{opacity:1;visibility:visible;transform:none}
  .slide-txt{max-width:560px}
  .slide-tag{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(var(--ink-rgb),.28);border-radius:999px;padding:6px 18px;font-size:13px;letter-spacing:2px;color:var(--gold);margin-bottom:22px}
  .slide-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);animation:blink 1.6s infinite}
  .slide h1{font-size:clamp(30px,4.6vw,50px);line-height:1.25;font-weight:800;letter-spacing:2px;color:var(--ink)}
  .slide h1 .hl{color:var(--gold)}
  .slide p{margin-top:18px;font-size:clamp(14px,1.8vw,17px);color:var(--ink-3)}
  .slide .slogan{margin-top:26px;font-family:var(--mono);font-size:14px;color:var(--ink-4);letter-spacing:1px}
  .slide-cta{margin-top:34px;display:flex;gap:16px;flex-wrap:wrap}
  .slide-art{flex-shrink:0;width:380px;height:340px;position:relative}
  .slide-art svg{position:absolute;inset:0;width:100%;height:100%}
  .slide-art .ring{animation:spin 26s linear infinite;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  .arrows{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:5}
  .arrows button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(var(--ink-rgb),.4);background:rgba(251,247,239,.7);color:var(--ink);font-size:20px;cursor:pointer;transition:background .2s,color .2s}
  .arrows button:hover{background:var(--ink);color:var(--paper-2)}
  .dots{position:absolute;top:30px;right:40px;display:flex;gap:10px;z-index:5}
  .dots button{width:9px;height:9px;border-radius:50%;border:none;background:rgba(var(--ink-rgb),.25);cursor:pointer;padding:0}
  .dots button.on{background:var(--gold)}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  /* ===== 图书馆 ===== */
  .lib-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px}
  .lib-card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:30px 28px;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column;gap:12px}
  .lib-card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(11,42,74,.16)}
  .lib-card .head{display:flex;align-items:center;justify-content:space-between}
  .lib-card .type{font-family:var(--mono);font-size:12px;color:var(--blue);letter-spacing:2px}
  .lib-card .status{font-size:12px;color:#fff;background:var(--orange);border-radius:999px;padding:3px 12px;font-weight:600}
  .lib-card .status.soon{background:var(--gray)}
  .lib-card h3{font-size:19px;color:var(--ink)}
  .lib-card p{font-size:14px;color:var(--gray);flex:1}
  .lib-card .meta{font-size:12px;color:#8A98A8;font-family:var(--mono)}

  /* ===== 在线阅读弹层 ===== */
  .reader-mask{position:fixed;inset:0;background:rgba(10,16,24,.66);z-index:200;display:none;align-items:center;justify-content:center;padding:30px}
  .reader-mask.on{display:flex}
  .reader{background:var(--paper);border-radius:14px;width:min(1080px,100%);height:min(85vh,860px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4)}
  .reader-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid rgba(var(--ink-rgb),.12);flex-shrink:0}
  .reader-bar span{font-size:15px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:16px}
  .reader-bar button{flex-shrink:0;border:1px solid rgba(var(--ink-rgb),.3);background:none;color:var(--ink);border-radius:8px;padding:5px 16px;font-size:14px;cursor:pointer;transition:all .2s}
  .reader-bar button:hover{background:var(--gold);border-color:var(--gold);color:#fff}
  .reader-body{flex:1;overflow:auto;background:var(--paper-2)}
  .reader-body iframe{width:100%;height:100%;border:none;display:block}
  .reader-body .docx-wrap{padding:30px}
  .reader-body .docx-wrap table{border-collapse:collapse}
  .reader-body .docx-wrap table, .reader-body .docx-wrap td, .reader-body .docx-wrap th{border:1px solid rgba(var(--ink-rgb),.25)}
  .reader-loading{padding:60px;text-align:center;color:var(--ink-3);font-size:15px}

  /* ===== 专题 / 收藏 / 关于 ===== */
  .fav-card{background:var(--paper-2);border:1px solid rgba(var(--ink-rgb),.12);border-radius:var(--radius);padding:28px 26px;transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column;gap:10px}
  .fav-card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,.12)}
  .fav-card .head{display:flex;align-items:center;justify-content:space-between}
  .fav-card .type{font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:2px}
  .fav-btn{border:1px solid rgba(var(--ink-rgb),.25);background:none;color:var(--ink-2);border-radius:999px;padding:4px 14px;font-size:12px;cursor:pointer;transition:all .2s}
  .fav-btn.on{background:var(--gold);border-color:var(--gold);color:#fff}
  .fav-card h3{font-size:17px;color:var(--ink)}
  .fav-card p{font-size:13.5px;color:var(--ink-3)}
  .about-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}
  .about-txt h3{font-size:22px;color:var(--ink);margin-bottom:16px}
  .about-txt p{font-size:15px;color:var(--ink-3);margin-bottom:12px;line-height:1.8}
  .about-list{list-style:none;margin-top:8px}
  .about-list li{font-size:14px;color:var(--ink-2);padding:6px 0 6px 24px;position:relative}
  .about-list li::before{content:"◆";position:absolute;left:0;color:var(--gold);font-size:11px;top:10px}
  .about-side{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;border-radius:var(--radius);padding:34px 30px}
  .about-side h4{font-size:16px;margin-bottom:14px;color:#fff}
  .about-side li{list-style:none;font-size:14px;color:rgba(255,255,255,.82);padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.15)}
  .about-side li:last-child{border-bottom:none}
  .about-side .big{margin-top:16px;text-align:center;font-size:20px;color:var(--orange);font-weight:700;letter-spacing:2px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 34px;border-radius:10px;font-size:16px;font-weight:600;transition:transform .2s,box-shadow .2s}
  .btn:hover{transform:translateY(-2px)}
  .btn-primary{background:var(--gold);color:var(--paper-2);box-shadow:0 8px 24px rgba(0,0,0,.15)}
  .btn-ghost{border:1.5px solid var(--ink);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}

  /* ===== 卖点条 ===== */
  .strip{background:var(--paper);border-bottom:1px solid rgba(var(--ink-rgb),.08)}
  .strip-inner{max-width:1180px;margin:0 auto;padding:18px 24px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .strip span{font-size:14px;color:var(--ink);background:var(--paper-3);border-radius:8px;padding:7px 16px;font-weight:600;letter-spacing:1px}
  .strip span b{color:var(--gold)}

  /* ===== 通用区 ===== */
  section{padding:90px 24px}
  .wrap{max-width:1180px;margin:0 auto}
  .sec-head{text-align:center;margin-bottom:56px}
  .sec-head .kicker{font-family:var(--mono);color:var(--blue);letter-spacing:3px;font-size:13px}
  .sec-head h2{font-size:clamp(24px,3.5vw,36px);color:var(--ink);font-weight:800;margin-top:10px;letter-spacing:1px}
  .sec-head p{color:var(--gray);margin-top:12px;max-width:620px;margin-left:auto;margin-right:auto}

  /* ===== 核心主张 ===== */
  .claim{background:var(--navy);color:#fff}
  .claim .sec-head h2{color:#fff}
  .claim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
  .claim-card{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    border-radius:var(--radius);padding:30px 24px;transition:transform .25s,border-color .25s;
  }
  .claim-card:hover{transform:translateY(-6px);border-color:var(--orange)}
  .claim-card .num{font-family:var(--mono);font-size:13px;color:var(--orange);letter-spacing:2px}
  .claim-card h3{font-size:19px;margin:12px 0 8px}
  .claim-card p{font-size:14px;color:rgba(255,255,255,.72)}
  .claim-card .cross{color:rgba(255,255,255,.4);font-size:13px}
  .claim-card .thumb{height:128px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;background:linear-gradient(135deg,rgba(30,111,217,.28),rgba(53,194,232,.12));border:1px solid rgba(255,255,255,.10)}
  .claim-card .en{font-family:var(--mono);font-size:12px;color:var(--cyan);letter-spacing:2px;margin-bottom:4px}

  /* ===== 服务 ===== */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:34px 28px;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s}
  .card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(11,42,74,.16)}
  .card .ico{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .card h3{font-size:19px;color:var(--ink);margin-bottom:10px}
  .card p{font-size:14px;color:var(--gray)}
  .card ul{list-style:none;margin-top:12px}
  .card li{font-size:13.5px;color:var(--gray);padding:3px 0 3px 20px;position:relative}
  .card li::before{content:"▸";position:absolute;left:0;color:var(--orange)}

  /* ===== 培训 ===== */
  .training{background:var(--paper-2)}
  .train-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:44px;align-items:center}
  .train-steps{display:flex;flex-direction:column;gap:16px}
  .step{display:flex;gap:16px;align-items:flex-start}
  .step .no{flex-shrink:0;width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--orange);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700}
  .step h4{font-size:17px;color:var(--ink)}
  .step p{font-size:14px;color:var(--gray)}
  .train-side{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;border-radius:var(--radius);padding:38px 32px}
  .train-side h3{font-size:22px;margin-bottom:18px}
  .train-side li{list-style:none;padding:9px 0 9px 26px;position:relative;font-size:15px;border-bottom:1px dashed rgba(255,255,255,.15)}
  .train-side li:last-child{border-bottom:none}
  .train-side li::before{content:"✓";position:absolute;left:0;color:var(--orange);font-weight:700}
  .train-side .big{margin-top:20px;font-size:26px;font-weight:800;color:var(--orange);text-align:center;letter-spacing:2px}

  /* ===== 平台 ===== */
  .platforms{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
  .platforms span{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:12px 26px;font-weight:600;color:var(--ink);box-shadow:0 4px 14px rgba(11,42,74,.06)}

  /* ===== 白皮书 ===== */
  .wp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:22px}
  .wp-card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:32px 28px;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s}
  .wp-card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(11,42,74,.16)}
  .wp-card .no{font-family:var(--mono);font-size:13px;color:var(--orange);letter-spacing:2px}
  .wp-card h3{font-size:19px;color:var(--ink);margin:10px 0 10px}
  .wp-card p{font-size:14px;color:var(--gray)}
  .wp-card .tag{display:inline-block;margin-top:14px;font-size:12px;color:var(--blue);border:1px solid rgba(30,111,217,.35);border-radius:999px;padding:4px 14px}

  /* ===== 联系 ===== */
  .contact{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;text-align:center}
  .contact h2{font-size:clamp(24px,3.5vw,36px);font-weight:800}
  .contact .p{margin:16px auto 0;max-width:560px;color:rgba(255,255,255,.8)}
  .contact .cta{margin-top:36px}
  .contact .note{margin-top:26px;font-size:13px;color:rgba(255,255,255,.5)}

  footer{background:#081E33;color:rgba(255,255,255,.55);text-align:center;padding:26px 20px;font-size:13px}

  /* ===== 动画 ===== */
  .reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
  .reveal.on{opacity:1;transform:none}

  @media(max-width:860px){
    nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--paper);flex-direction:column;padding:16px 24px;gap:16px}
    nav.open{display:flex}
    .menu-btn{display:block}
    .nav-center{gap:10px}
    .nav-search{width:120px;padding:6px 10px}
    .nav-search .search-kbd{display:none}
    .train-grid{grid-template-columns:1fr}
    .about-grid{grid-template-columns:1fr}
    .slides{height:520px}
    .slide{padding:0 24px}
    .slide-art{display:none}
    .slide-txt{max-width:100%}
    .dots{right:24px}
    section{padding:64px 20px}
  }
</style>
</head>
<body>
<!-- ========== 导航 ========== -->
<header>
  <div class="nav-wrap">
    <a class="logo" href="#top">
      <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="16" stroke="var(--gold)" stroke-width="3"/>
        <circle cx="20" cy="20" r="7" fill="var(--ink-4)"/>
        <path d="M20 2v7M20 31v7M2 20h7M31 20h7" stroke="var(--gold)" stroke-width="3" stroke-linecap="round"/>

<div class="hero" id="top" style="padding:130px 0 60px;">
  <div class="slides" style="height:auto;">
    <div class="slide on" style="position:relative;padding:0 24px;opacity:1;visibility:visible;transform:none;">
      <div class="slide-txt" style="max-width:100%;text-align:center;margin:0 auto;">
        <span class="slide-tag">TOPICS</span>
        <h1>参数化设计专题</h1>

<section id="topics">
  <div class="wrap">
    <div class="lib-grid" id="topicGrid"></div>
  </div>
</section>

<footer>© 2026 DIY参数化 · 非标自动化参数化设计 · 只要变化有规律，就能实现自动设计</footer>
<!-- 在线阅读弹层 -->
<div class="reader-mask" id="readerMask">
  <div class="reader">
    <div class="reader-bar">
      <span id="readerTitle">阅读</span>
      <button id="readerClose">关闭 ✕</button>
    </div>
    <div class="reader-body" id="readerBody"><div class="reader-loading">加载中…</div></div>
  </div>
</div>
<script src="library-data.js"></script>
<script>
// 滚动渐入（可复用：动态渲染的卡片也调用）
  let io;
  function observeReveals(){
    if(!io){
      io = new IntersectionObserver(es=>{
        es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('on'); io.unobserve(e.target);} });
      },{threshold:.12});
    }
    document.querySelectorAll('.reveal').forEach(el=>{
      if(!el.classList.contains('on')) io.observe(el);
    });
  }
  observeReveals();

  // 点击导航关闭移动端菜单
  document.querySelectorAll('#nav a').forEach(a=>{
    a.addEventListener('click',()=>document.getElementById('nav').classList.remove('open'));
  });

  // 主题切换（素 / 宣纸 / 墨夜）
  (function(){
    const sw = document.getElementById('themeSwitch');
    const saved = localStorage.getItem('diy-theme') || 'xuanzhi';
    function apply(t){
      document.documentElement.setAttribute('data-theme', t);
      try{ localStorage.setItem('diy-theme', t); }catch(e){}
      sw.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.theme === t));
    }
    sw.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>apply(b.dataset.theme)));
    apply(saved);
  })();

  // 搜索：/ 快捷键聚焦 + 回车站内检索
  (function(){
    const input = document.getElementById('searchInput');
    if(!input) return;
    const sections = Array.from(document.querySelectorAll('section, .hero')).filter(el=>el.id);
    document.addEventListener('keydown', e=>{
      if(e.key === '/' && document.activeElement !== input){
        e.preventDefault(); input.focus();
      }
    });
    input.addEventListener('keydown', e=>{
      if(e.key !== 'Enter') return;
      const q = input.value.trim();
      if(!q) return;
      let found = null;
      for(const el of sections){
        if(el.innerText && el.innerText.includes(q)){ found = el; break; }
      }
      if(found){
        found.scrollIntoView({behavior:'smooth'});
        const h = found.querySelector('h1,h2,h3');
        if(h){ h.style.transition='background .8s'; h.style.background='rgba(var(--gold-rgb),.3)'; setTimeout(()=>h.style.background='transparent', 1600); }
      } else {
        input.style.borderColor = 'var(--gold)';
        setTimeout(()=>input.style.borderColor='', 1200);
      }
    });
  })();

  // 收藏交互（localStorage 记忆，可复用）
  function initFavs(){
    const btnSel = '.fav-btn';
    const saved = (function(){ try{ return JSON.parse(localStorage.getItem('diy-favs')||'[]'); }catch(e){ return []; } })();
    document.querySelectorAll('.fav-card').forEach(card=>{
      if(card._favBound) return;
      card._favBound = true;
      const btn = card.querySelector(btnSel);
      const key = card.dataset.fav;
      if(saved.includes(key)) btn.classList.add('on');
      btn.addEventListener('click', ()=>{
        const idx = saved.indexOf(key);
        if(idx > -1){ saved.splice(idx,1); btn.classList.remove('on'); }
        else { saved.push(key); btn.classList.add('on'); }
        try{ localStorage.setItem('diy-favs', JSON.stringify(saved)); }catch(e){}
      });
    });
  }
  initFavs();

  // 在线阅读弹层（PDF 内嵌预览 / Word 在线渲染）
  (function(){
    const mask = document.getElementById('readerMask');
    const title = document.getElementById('readerTitle');
    const body = document.getElementById('readerBody');
    const close = document.getElementById('readerClose');
    close.addEventListener('click', ()=>{ mask.classList.remove('on'); body.innerHTML=''; });
    mask.addEventListener('click', e=>{ if(e.target === mask){ mask.classList.remove('on'); body.innerHTML=''; } });

    async function openDoc(link, name, ext){
      title.textContent = name;
      body.innerHTML = '<div class="reader-loading">加载中…</div>';
      mask.classList.add('on');
      const url = link;
      if(ext === 'pdf'){
        body.innerHTML = '<iframe src="' + url + '"></iframe>';
        return;
      }
      if(ext === 'docx' || ext === 'doc'){
        try{
          const resp = await fetch(url);
          const buf = await resp.arrayBuffer();
          body.innerHTML = '<div class="docx-wrap"></div>';
          const wrap = body.querySelector('.docx-wrap');
          await docx.renderAsync(buf, wrap, null, {breakPages:true, ignoreLastRenderedPageBreak:false});
        }catch(e){
          body.innerHTML = '<div class="reader-loading">预览失败，<a href="' + url + '" target="_blank" style="color:var(--gold);text-decoration:underline;">点击下载查看</a></div>';
        }
        return;
      }
      body.innerHTML = '<div class="reader-loading">该格式暂不支持在线预览，<a href="' + url + '" target="_blank" style="color:var(--gold);text-decoration:underline;">点击下载查看</a></div>';
    }

    document.addEventListener('click', e=>{
      const btn = e.target.closest('.read-btn');
      if(btn){
        const card = btn.closest('.lib-card, .fav-card');
        const name = card ? (card.querySelector('h3') ? card.querySelector('h3').textContent : '') : '';
        openDoc(btn.dataset.link, name, btn.dataset.ext);
      }
    });
    window.__openDoc = openDoc;
  })();

  // 图书馆 / 专题 / 收藏 数据渲染（数据在 library-data.js）
  (function(){
    const data = (window.DIY_LIBRARY) || {library:[],topics:[],favorites:[]};
    function readBtn(item){
      if(!item.link) return '';
      const ext = (item.link.split('.').pop()||'').toLowerCase();
      return '<button class="read-btn" style="align-self:flex-start;margin-top:12px;font-size:13px;color:var(--gold);border:1px solid rgba(var(--gold-rgb),.45);background:none;border-radius:8px;padding:6px 16px;cursor:pointer;transition:all .2s;" data-link="' + item.link + '" data-ext="' + ext + '">在线阅读 ↗</button>';
    }
    function libCard(item){
      return '<div class="lib-card reveal">' +
        '<div class="head"><span class="type">' + (item.type||'') + '</span><span class="status">' + (item.status||'') + '</span></div>' +
        '<h3>' + item.title + '</h3><p>' + item.desc + '</p>' +
        '<div class="meta">' + (item.meta||'') + '</div>' + readBtn(item) +
      '</div>';
    }
    function favCard(item){
      return '<div class="fav-card reveal" data-fav="' + item.favKey + '">' +
        '<div class="head"><span class="type">' + (item.type||'') + '</span><button class="fav-btn">收藏</button></div>' +
        '<h3>' + item.title + '</h3><p>' + item.desc + '</p>' +
        '<div class="meta">' + (item.meta||'') + '</div>' + readBtn(item) +
      '</div>';
    }
    document.getElementById('topicGrid').innerHTML = data.topics.map(libCard).join('');
    observeReveals();
    initFavs();
  })();

</script>
</body>
